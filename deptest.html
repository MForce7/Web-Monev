<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen & Pemantauan Aktivitas Riset</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gov: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#334e68',
                            600: '#243b53',
                            700: '#102a43',
                            800: '#0b69a3',
                            900: '#035388',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
                font-size: 10pt;
            }
            .print-full-width {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Information Card -->
        <div id="headerCard" class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden transition-all">
            <!-- Dynamic Header Rendered by JavaScript -->
        </div>

        <!-- Main Monthly Table Container -->
        <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center no-print">
                <h3 class="font-bold text-slate-700 text-base"><i class="fa-solid fa-calendar-days mr-2 text-gov-600"></i> Log Progres Bulanan (Januari - Desember)</h3>
                <button onclick="window.print()" class="px-3 py-1.5 bg-slate-600 hover:bg-slate-700 text-white rounded text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-print"></i> Cetak Laporan
                </button>
            </div>

            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left text-xs border-collapse min-w-[1400px]" id="mainTable">
                    <thead>
                        <!-- Row 1 Header -->
                        <tr class="bg-gov-700 text-white text-center font-semibold border-b border-gov-800">
                            <th rowspan="2" class="p-3 border-r border-gov-600 w-24">Bulan</th>
                            <th colspan="4" class="p-2.5 border-r border-gov-600 bg-gov-800 uppercase tracking-wider">Progres Aktivitas / Kegiatan</th>
                            <th colspan="5" class="p-2.5 border-r border-gov-600 bg-slate-800 uppercase tracking-wider">Progres Capaian Output</th>
                            <th rowspan="2" class="p-3 border-r border-gov-600 w-32 no-print">Tindakan</th>
                        </tr>
                        <!-- Row 2 Header Sub-Progres -->
                        <tr class="bg-gov-600 text-white text-center font-medium">
                            <th class="p-2.5 border-r border-gov-500 min-w-[200px]">Uraian Kemajuan Aktivitas</th>
                            <th class="p-2.5 border-r border-gov-500 min-w-[150px]">Kendala Ditemui</th>
                            <th class="p-2.5 border-r border-gov-500 min-w-[150px]">Mitigasi / Rencana Tindak Lanjut</th>
                            <th class="p-2.5 border-r border-gov-500 min-w-[160px]">Data Dukung Progres</th>

                            <th class="p-2.5 border-r border-slate-700 min-w-[140px]">Jenis Output</th>
                            <th class="p-2.5 border-r border-slate-700 min-w-[160px]">Judul Output</th>
                            <th class="p-2.5 border-r border-slate-700 w-28">Status</th>
                            <th class="p-2.5 border-r border-slate-700 w-24">Capaian (%)</th>
                            <th class="p-2.5 border-r border-slate-700 min-w-[160px]">Data Dukung Output</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200">
                        <!-- Dynamic Content Generated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Data Header Utama
        let headerData = {
            isEditing: false,
            namaKetua: "morpheus",
            unitKerja: "Pusat Riset Antariksa",
            satuanKerja: "Organisasi Riset Penerbangan dan Antariksa",
            judulAktivitas: "Pengembangan Sistem Otomasi Berbasis AI",
            targetOutputs: [
                { jenis: "Purwarupa", jumlah: 1 },
                { jenis: "KI (Kekayaan Intelektual)", jumlah: 2 }
            ],
            progresTotal: 50,
            progresKeterangan: "Sudah menyelesaikan purwarupa awal",
            statusPelaksanaan: "Pelaksanaan / Berjalan"
        };

        // Data Bulan Default
        const months = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni",
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        // Store Data Per Month
        const monthlyData = {};

        months.forEach(month => {
            monthlyData[month] = {
                isEditing: false,
                uraian: "",
                kendala: "",
                mitigasi: "",
                dataDukungProgres: "",
                outputs: [
                    { jenis: "Purwarupa", judul: "", status: "Draft", progress: 0, dataDukung: "" }
                ]
            };
        });

        // Seed Contoh Data untuk Bulan Januari
        monthlyData["Januari"] = {
            isEditing: false,
            uraian: "Perancangan arsitektur awal dan studi literatur.",
            kendala: "Keterlambatan pengadaan komponen.",
            mitigasi: "Menggunakan komponen cadangan di lab.",
            dataDukungProgres: "Dokumen_Desain.pdf",
            outputs: [
                { jenis: "Purwarupa", judul: "Desain Skema IoT", status: "Selesai", progress: 100, dataDukung: "Foto_Skema.png" }
            ]
        };

        // -------------------------------------------------------------
        // RENDER HEADER (DETAIL AKTIVITAS)
        // -------------------------------------------------------------
        function renderHeader() {
            const container = document.getElementById('headerCard');

            if (headerData.isEditing) {
                // MODE EDIT HEADER
                container.innerHTML = `
                    <div class="bg-amber-600 text-white px-6 py-4 font-semibold text-lg flex items-center justify-between">
                        <span><i class="fa-solid fa-pen-to-square mr-2"></i> Edit Detail Aktivitas</span>
                        <span class="text-xs bg-amber-700 px-3 py-1 rounded-full text-amber-100">Mode Edit</span>
                    </div>
                    <div class="p-6 bg-amber-50/30">
                        <table class="w-full text-sm border-collapse">
                            <tbody>
                                <tr class="border-b border-slate-200">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 w-1/3 bg-slate-100/70">Nama Ketua</td>
                                    <td class="py-2.5 px-4 text-slate-500 font-semibold bg-slate-50">${headerData.namaKetua} <span class="text-[10px] text-slate-400 font-normal ml-2">(Terkunci)</span></td>
                                </tr>
                                <tr class="border-b border-slate-200">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 bg-slate-100/70">Unit Kerja</td>
                                    <td class="py-2.5 px-4 text-slate-500 bg-slate-50">${headerData.unitKerja} <span class="text-[10px] text-slate-400 font-normal ml-2">(Terkunci)</span></td>
                                </tr>
                                <tr class="border-b border-slate-200">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 bg-slate-100/70">Satuan Kerja</td>
                                    <td class="py-2.5 px-4 text-slate-500 bg-slate-50">${headerData.satuanKerja} <span class="text-[10px] text-slate-400 font-normal ml-2">(Terkunci)</span></td>
                                </tr>
                                
                                <!-- Judul Aktivitas (Editable) -->
                                <tr class="border-b border-slate-200">
                                    <td class="py-2.5 px-4 font-medium text-slate-700 bg-slate-100/70">Judul Aktivitas</td>
                                    <td class="py-2.5 px-4">
                                        <input type="text" id="editJudulAktivitas" value="${headerData.judulAktivitas}" class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    </td>
                                </tr>

                                <!-- Target Output Utama (Editable Rows) -->
                                <tr class="border-b border-slate-200">
                                    <td class="py-2.5 px-4 font-medium text-slate-700 bg-slate-100/70 align-top">Target Output Utama</td>
                                    <td class="py-2.5 px-4">
                                        <div class="space-y-2" id="headerOutputContainer">
                                            ${headerData.targetOutputs.map((out, idx) => `
                                                <div class="flex items-center gap-2">
                                                    <select onchange="headerData.targetOutputs[${idx}].jenis = this.value" class="p-1.5 border border-slate-300 rounded text-xs">
                                                        <option value="Purwarupa" ${out.jenis === 'Purwarupa' ? 'selected' : ''}>Purwarupa</option>
                                                        <option value="Publikasi" ${out.jenis === 'Publikasi' ? 'selected' : ''}>Publikasi</option>
                                                        <option value="KI (Kekayaan Intelektual)" ${out.jenis.includes('KI') ? 'selected' : ''}>KI (Kekayaan Intelektual)</option>
                                                        <option value="Model" ${out.jenis === 'Model' ? 'selected' : ''}>Model</option>
                                                        <option value="Naskah Kebijakan" ${out.jenis === 'Naskah Kebijakan' ? 'selected' : ''}>Naskah Kebijakan</option>
                                                    </select>
                                                    <input type="number" min="1" value="${out.jumlah}" onchange="headerData.targetOutputs[${idx}].jumlah = parseInt(this.value) || 1" class="w-20 p-1.5 border border-slate-300 rounded text-xs text-center" placeholder="Jumlah">
                                                    <span class="text-xs text-slate-500">buah</span>
                                                    ${headerData.targetOutputs.length > 1 ? `
                                                        <button onclick="removeHeaderTarget(${idx})" class="text-rose-500 hover:text-rose-700 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                                                    ` : ''}
                                                </div>
                                            `).join('')}
                                        </div>
                                        <button onclick="addHeaderTarget()" class="mt-2 text-xs text-emerald-700 bg-emerald-100 hover:bg-emerald-200 px-2.5 py-1 rounded font-medium transition flex items-center gap-1">
                                            <i class="fa-solid fa-plus"></i> Tambah Target Output
                                        </button>
                                    </td>
                                </tr>

                                <!-- Progres Total & Keterangan (Editable) -->
                                <tr class="border-b border-slate-200">
                                    <td class="py-2.5 px-4 font-medium text-slate-700 bg-slate-100/70">Progres Total Aktivitas</td>
                                    <td class="py-2.5 px-4">
                                        <div class="flex items-center gap-3">
                                            <div class="flex items-center gap-1">
                                                <input type="number" id="editProgresTotal" min="0" max="100" value="${headerData.progresTotal}" class="w-20 p-1.5 border border-slate-300 rounded text-sm text-center font-bold text-emerald-600">
                                                <span class="font-bold text-slate-600">%</span>
                                            </div>
                                            <input type="text" id="editProgresKet" value="${headerData.progresKeterangan}" class="w-full p-1.5 border border-slate-300 rounded text-xs" placeholder="Keterangan progres...">
                                        </div>
                                    </td>
                                </tr>

                                <!-- Status Pelaksanaan (Editable) -->
                                <tr>
                                    <td class="py-2.5 px-4 font-medium text-slate-700 bg-slate-100/70">Status Pelaksanaan</td>
                                    <td class="py-2.5 px-4">
                                        <select id="editStatusPelaksanaan" class="p-2 border border-slate-300 rounded text-xs">
                                            <option value="Perencanaan" ${headerData.statusPelaksanaan === 'Perencanaan' ? 'selected' : ''}>Perencanaan</option>
                                            <option value="Pelaksanaan / Berjalan" ${headerData.statusPelaksanaan.includes('Pelaksanaan') ? 'selected' : ''}>Pelaksanaan / Berjalan</option>
                                            <option value="Selesai" ${headerData.statusPelaksanaan === 'Selesai' ? 'selected' : ''}>Selesai</option>
                                            <option value="Terkendala" ${headerData.statusPelaksanaan === 'Terkendala' ? 'selected' : ''}>Terkendala</option>
                                        </select>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="mt-4 flex justify-end gap-2 no-print">
                            <button onclick="saveHeaderEdit()" class="px-4 py-2 bg-gov-700 hover:bg-gov-800 text-white rounded text-xs font-semibold shadow transition flex items-center gap-1.5">
                                <i class="fa-solid fa-check"></i> Simpan Perubahan
                            </button>
                            <button onclick="toggleHeaderEdit(false)" class="px-4 py-2 bg-slate-300 hover:bg-slate-400 text-slate-700 rounded text-xs font-semibold transition">
                                Batal
                            </button>
                        </div>
                    </div>
                `;
            } else {
                // MODE VIEW HEADER
                container.innerHTML = `
                    <div class="bg-gov-700 text-white px-6 py-4 font-semibold text-lg flex items-center justify-between">
                        <span><i class="fa-solid fa-folder-open mr-2"></i> Detail Aktivitas & Progres Kegiatan</span>
                        <div class="flex items-center gap-2 no-print">
                            <button onclick="toggleHeaderEdit(true)" class="px-3 py-1 bg-gov-800 hover:bg-gov-900 border border-gov-500 rounded text-xs text-white transition flex items-center gap-1.5">
                                <i class="fa-solid fa-pen-to-square"></i> Edit Detail
                            </button>
                        </div>
                    </div>
                    
                    <div class="p-6">
                        <table class="w-full text-sm border-collapse">
                            <tbody>
                                <tr class="border-b border-slate-100">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 w-1/3 bg-slate-50/50">Nama Ketua</td>
                                    <td class="py-2.5 px-4 font-semibold text-slate-800">${headerData.namaKetua}</td>
                                </tr>
                                <tr class="border-b border-slate-100">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 bg-slate-50/50">Unit Kerja (Pusat Riset/Direktorat)</td>
                                    <td class="py-2.5 px-4 text-slate-800">${headerData.unitKerja}</td>
                                </tr>
                                <tr class="border-b border-slate-100">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 bg-slate-50/50">Satuan Kerja (Organisasi Riset/Deputi)</td>
                                    <td class="py-2.5 px-4 text-slate-800">${headerData.satuanKerja}</td>
                                </tr>
                                <tr class="border-b border-slate-100">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 bg-slate-50/50">Judul Aktivitas</td>
                                    <td class="py-2.5 px-4 font-medium text-slate-800">${headerData.judulAktivitas}</td>
                                </tr>
                                
                                <!-- Target Output Table Inline -->
                                <tr class="border-b border-slate-100">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 bg-slate-50/50 align-top">Target Output Utama</td>
                                    <td class="py-2 px-4">
                                        <table class="w-full text-xs border border-slate-200 rounded-md overflow-hidden max-w-lg">
                                            <tr class="bg-slate-100 border-b border-slate-200 font-semibold text-slate-600">
                                                <th class="p-2 text-left">Jenis Output</th>
                                                <th class="p-2 text-center w-28">Jumlah</th>
                                            </tr>
                                            ${headerData.targetOutputs.map(out => `
                                                <tr class="border-b border-slate-100 hover:bg-slate-50">
                                                    <td class="p-2 font-medium text-slate-700">${out.jenis}</td>
                                                    <td class="p-2 text-center font-semibold text-slate-800">${out.jumlah} buah</td>
                                                </tr>
                                            `).join('')}
                                        </table>
                                    </td>
                                </tr>

                                <tr class="border-b border-slate-100">
                                    <td class="py-2.5 px-4 font-medium text-slate-500 bg-slate-50/50">Progres Total Aktivitas</td>
                                    <td class="py-2.5 px-4 font-semibold text-emerald-600">
                                        <div class="flex items-center gap-3">
                                            <div class="w-full bg-slate-200 rounded-full h-2.5 max-w-xs">
                                                <div class="bg-emerald-500 h-2.5 rounded-full" style="width: ${headerData.progresTotal}%"></div>
                                            </div>
                                            <span>${headerData.progresTotal}% <span class="font-normal text-slate-500 text-xs">(${headerData.progresKeterangan})</span></span>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="py-2.5 px-4 font-medium text-slate-500 bg-slate-50/50">Status Pelaksanaan</td>
                                    <td class="py-2.5 px-4">
                                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-amber-100 text-amber-800">
                                            ${headerData.statusPelaksanaan}
                                        </span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
        }

        // Action Header Functions
        function toggleHeaderEdit(status) {
            headerData.isEditing = status;
            renderHeader();
        }

        function addHeaderTarget() {
            headerData.targetOutputs.push({ jenis: "Purwarupa", jumlah: 1 });
            renderHeader();
        }

        function removeHeaderTarget(index) {
            headerData.targetOutputs.splice(index, 1);
            renderHeader();
        }

        function saveHeaderEdit() {
            headerData.judulAktivitas = document.getElementById('editJudulAktivitas').value;
            headerData.progresTotal = parseInt(document.getElementById('editProgresTotal').value) || 0;
            headerData.progresKeterangan = document.getElementById('editProgresKet').value;
            headerData.statusPelaksanaan = document.getElementById('editStatusPelaksanaan').value;
            
            headerData.isEditing = false;
            renderHeader();
        }

        // -------------------------------------------------------------
        // RENDER BULANAN (MONTHLY LOG TABLE)
        // -------------------------------------------------------------
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            months.forEach(month => {
                const data = monthlyData[month];
                const outputCount = data.outputs.length;

                data.outputs.forEach((output, index) => {
                    const tr = document.createElement('tr');
                    tr.className = data.isEditing ? "bg-amber-50/60" : "hover:bg-slate-50 transition";

                    // Hanya render kolom kiri di baris pertama output bulan bersangkutan
                    if (index === 0) {
                        const tdMonth = `<td rowspan="${outputCount}" class="p-3 font-semibold text-slate-700 text-center border-r border-slate-200 align-top bg-slate-50">${month}</td>`;
                        
                        let tdAktivitas = '';
                        if (data.isEditing) {
                            tdAktivitas = `
                                <td rowspan="${outputCount}" class="p-2 border-r border-slate-200 align-top">
                                    <textarea id="uraian-${month}" class="w-full p-1.5 border border-slate-300 rounded text-xs focus:ring-1 focus:ring-gov-500" rows="3" placeholder="Uraian kemajuan...">${data.uraian}</textarea>
                                </td>
                                <td rowspan="${outputCount}" class="p-2 border-r border-slate-200 align-top">
                                    <textarea id="kendala-${month}" class="w-full p-1.5 border border-slate-300 rounded text-xs focus:ring-1 focus:ring-gov-500" rows="3" placeholder="Kendala...">${data.kendala}</textarea>
                                </td>
                                <td rowspan="${outputCount}" class="p-2 border-r border-slate-200 align-top">
                                    <textarea id="mitigasi-${month}" class="w-full p-1.5 border border-slate-300 rounded text-xs focus:ring-1 focus:ring-gov-500" rows="3" placeholder="Mitigasi...">${data.mitigasi}</textarea>
                                </td>
                                <td rowspan="${outputCount}" class="p-2 border-r border-slate-200 align-top">
                                    <input type="text" id="dukungProgres-${month}" value="${data.dataDukungProgres}" class="w-full p-1.5 border border-slate-300 rounded text-xs" placeholder="Link / Nama File">
                                </td>
                            `;
                        } else {
                            tdAktivitas = `
                                <td rowspan="${outputCount}" class="p-3 border-r border-slate-200 align-top">${data.uraian || '-'}</td>
                                <td rowspan="${outputCount}" class="p-3 border-r border-slate-200 align-top text-slate-600">${data.kendala || '-'}</td>
                                <td rowspan="${outputCount}" class="p-3 border-r border-slate-200 align-top text-slate-600">${data.mitigasi || '-'}</td>
                                <td rowspan="${outputCount}" class="p-3 border-r border-slate-200 align-top font-mono text-[11px] text-gov-800">${data.dataDukungProgres ? `<i class="fa-solid fa-paperclip mr-1"></i>${data.dataDukungProgres}` : '-'}</td>
                            `;
                        }

                        tr.innerHTML += tdMonth + tdAktivitas;
                    }

                    // Kolom Output
                    if (data.isEditing) {
                        tr.innerHTML += `
                            <td class="p-2 border-r border-slate-200 align-top">
                                <select onchange="updateOutputField('${month}', ${index}, 'jenis', this.value)" class="w-full p-1 border border-slate-300 rounded text-xs">
                                    <option value="Purwarupa" ${output.jenis === 'Purwarupa' ? 'selected' : ''}>Purwarupa</option>
                                    <option value="Publikasi" ${output.jenis === 'Publikasi' ? 'selected' : ''}>Publikasi</option>
                                    <option value="KI" ${output.jenis === 'KI' ? 'selected' : ''}>KI (Hobi/Paten)</option>
                                    <option value="Model" ${output.jenis === 'Model' ? 'selected' : ''}>Model</option>
                                    <option value="Naskah Kebijakan" ${output.jenis === 'Naskah Kebijakan' ? 'selected' : ''}>Naskah Kebijakan</option>
                                </select>
                            </td>
                            <td class="p-2 border-r border-slate-200 align-top">
                                <input type="text" value="${output.judul}" onchange="updateOutputField('${month}', ${index}, 'judul', this.value)" class="w-full p-1 border border-slate-300 rounded text-xs" placeholder="Judul output">
                            </td>
                            <td class="p-2 border-r border-slate-200 align-top">
                                <select onchange="updateOutputField('${month}', ${index}, 'status', this.value)" class="w-full p-1 border border-slate-300 rounded text-xs">
                                    <option value="Draft" ${output.status === 'Draft' ? 'selected' : ''}>Draft</option>
                                    <option value="Proses" ${output.status === 'Proses' ? 'selected' : ''}>Proses</option>
                                    <option value="Selesai" ${output.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                                </select>
                            </td>
                            <td class="p-2 border-r border-slate-200 align-top">
                                <input type="number" min="0" max="100" value="${output.progress}" onchange="updateOutputField('${month}', ${index}, 'progress', this.value)" class="w-full p-1 border border-slate-300 rounded text-xs text-center">
                            </td>
                            <td class="p-2 border-r border-slate-200 align-top">
                                <div class="flex gap-1 items-center">
                                    <input type="text" value="${output.dataDukung}" onchange="updateOutputField('${month}', ${index}, 'dataDukung', this.value)" class="w-full p-1 border border-slate-300 rounded text-xs" placeholder="File / Link">
                                    ${data.outputs.length > 1 ? `<button onclick="removeOutput('${month}',${index})" class="text-rose-500 hover:text-rose-700 p-1"><i class="fa-solid fa-trash"></i></button>` : ''}
                                </div>
                            </td>
                        `;
                    } else {
                        tr.innerHTML += `
                            <td class="p-3 border-r border-slate-200 align-top font-medium text-slate-700">${output.jenis}</td>
                            <td class="p-3 border-r border-slate-200 align-top">${output.judul || '-'}</td>
                            <td class="p-3 border-r border-slate-200 align-top text-center">
                                <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${output.status === 'Selesai' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">${output.status}</span>
                            </td>
                            <td class="p-3 border-r border-slate-200 align-top text-center font-semibold text-slate-700">${output.progress}%</td>
                            <td class="p-3 border-r border-slate-200 align-top font-mono text-[11px] text-gov-800">${output.dataDukung ? `<i class="fa-solid fa-link mr-1"></i>${output.dataDukung}` : '-'}</td>
                        `;
                    }

                    // Kolom Action
                    if (index === 0) {
                        let tdAction = '';
                        if (data.isEditing) {
                            tdAction = `
                                <td rowspan="${outputCount}" class="p-2 text-center align-top no-print bg-amber-50/80">
                                    <div class="flex flex-col gap-1.5">
                                        <button onclick="addOutputRow('${month}')" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-medium transition">
                                            <i class="fa-solid fa-plus mr-1"></i> Output
                                        </button>
                                        <button onclick="saveEdit('${month}')" class="px-2 py-1 bg-gov-700 hover:bg-gov-800 text-white rounded text-[11px] font-medium transition">
                                            <i class="fa-solid fa-check mr-1"></i> Simpan
                                        </button>
                                        <button onclick="toggleEdit('${month}', false)" class="px-2 py-1 bg-slate-300 hover:bg-slate-400 text-slate-700 rounded text-[11px] font-medium transition">
                                            Batal
                                        </button>
                                    </div>
                                </td>
                            `;
                        } else {
                            tdAction = `
                                <td rowspan="${outputCount}" class="p-3 text-center align-top no-print">
                                    <button onclick="toggleEdit('${month}', true)" class="px-3 py-1.5 bg-slate-100 hover:bg-gov-50 text-gov-700 border border-slate-300 rounded font-medium transition flex items-center justify-center gap-1 mx-auto text-xs">
                                        <i class="fa-solid fa-pen-to-square"></i> Edit
                                    </button>
                                </td>
                            `;
                        }
                        tr.innerHTML += tdAction;
                    }

                    tbody.appendChild(tr);
                });
            });
        }

        // Action Monthly Functions
        function toggleEdit(month, status) {
            monthlyData[month].isEditing = status;
            renderTable();
        }

        function addOutputRow(month) {
            monthlyData[month].outputs.push({
                jenis: "Purwarupa",
                judul: "",
                status: "Draft",
                progress: 0,
                dataDukung: ""
            });
            renderTable();
        }

        function removeOutput(month, index) {
            monthlyData[month].outputs.splice(index, 1);
            renderTable();
        }

        function updateOutputField(month, index, field, value) {
            monthlyData[month].outputs[index][field] = value;
        }

        function saveEdit(month) {
            const data = monthlyData[month];
            data.uraian = document.getElementById(`uraian-${month}`).value;
            data.kendala = document.getElementById(`kendala-${month}`).value;
            data.mitigasi = document.getElementById(`mitigasi-${month}`).value;
            data.dataDukungProgres = document.getElementById(`dukungProgres-${month}`).value;
            
            data.isEditing = false;
            renderTable();
        }

        // Inisialisasi Tampilan Pertama
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader();
            renderTable();
        });
    </script>
</body>
</html>
